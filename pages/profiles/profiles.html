<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <link rel="shortcut icon" href="../assets/netflix-icon.svg">
    <link rel="stylesheet" href="../profiles/profiles.css">
    <link rel="stylesheet" href="../profiles/responsive.css">
    <title>Netflix</title>
</head>
<body>
    <nav>
        <a href="../../index.html">
            <img src="../assets/netflix-logo.svg" alt="netflix-logo" class="logo" />
        </a>
        <span class="material-symbols-outlined">edit</span>
    </nav>
    <main class="content">
        <p class="title">Who's watching?</p>

        <div class="profile-boxes">
            <div class="row">
                <div class="profile">
                    <img src="../assets/blue-avatar.png" alt="blue-avatar" class="avatar" />
                    <p>Amahle</p>
                </div>
                <div class="profile">
                    <img src="../assets/green-avatar.jpg" alt="green-avatar" class="avatar" />
                    <p>Mossy</p>
                </div>
            </div>
            <div class="row">
                <div class="profile">
                    <img src="../assets/yellow-avatar.jpg" alt="yellow-avatar" class="avatar" />
                    <p>Sarah</p>
                </div>
                <div class="profile">
                    <img src="../assets/red-avatar.jpg" alt="red-avatar" class="avatar" />
                    <p>Mmabatho</p>
                </div>
            </div>
            <div class="row">
                <div class="profile">
                    <img src="../assets/kids-avatar.webp" alt="kids-avatar" class="avatar" />
                    <p>Kids</p>
                </div>
                <div class="profile">
                    <div class="add-profile">
                        <span class="material-symbols-outlined">add_2</span>
                    </div>
                    <p>Add Profile</p>
                </div>
            </div>
        </div>

        <div class="setting">

        </div>
    </main>

    
</body>
</html>
